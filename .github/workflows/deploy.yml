# Publie le site sur GitHub Pages à chaque envoi, et chaque matin après avoir lu les nouvelles vidéos de la chaîne.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read new videos from the channel
        run: node scripts/update-videos.js
      - name: Redirect old Podia addresses
        run: node scripts/make-redirects.js
      - name: Save new videos
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "Antidote"
            git config user.email "contact@antidote-thechannel.com"
            git commit -m "New video from the channel"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
