<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- adresse provisoire : à retirer le jour de la bascule du domaine -->
<meta name="robots" content="noindex">
<title>Library · Antidote</title>
<link rel="stylesheet" href="site.css?v=8">
</head><body>
<script src="data.js?v=8"></script><script src="site.js?v=8"></script>
<script>
var rest = P.filter(function (p) { return p.c !== 'systems'; }), free = P.filter(function (p) { return !p.pr; }).length;
var n = { all: rest.length, blueprints: 0, challenges: 0 }; rest.forEach(function (p) { n[p.c]++; });
mount('', '<div class="top"><div class="wrap"><div class="eyebrow">The library</div><h1>The books you love, <em>ready to use.</em></h1>' +
  '<p class="sub">Blueprints turn one book into a plan. Systems run the parts of your life a single book can’t fix.</p></div></div>' +
  '<div class="wrap"><section id="systems"><div class="row-h"><h2>Systems</h2></div><div class="sys">' + systemCards() + '</div></section>' +
  '<section id="blueprints"><div class="row-h"><div><h2>Blueprints</h2><div class="tabs" id="tabs">' +
  [['all', 'All'], ['blueprints', 'Blueprints'], ['challenges', 'Challenges']].map(function (t, i) { return '<button type="button" data-f="' + t[0] + '" aria-pressed="' + (i === 0) + '">' + t[1] + '<i>' + n[t[0]] + '</i></button>'; }).join('') + '</div></div></div>' +
  '<div class="g1" id="grid">' + rest.map(productCard).join('') + '</div></section>' + newsletterBand() + '</div>');
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var f = b.getAttribute('data-f');
  [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  [].forEach.call(document.querySelectorAll('#grid .k'), function (k) { k.hidden = f !== 'all' && k.getAttribute('data-c') !== f; });
});
</script></body></html>
