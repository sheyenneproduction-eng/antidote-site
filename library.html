<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · Antidote</title>
<link rel="stylesheet" href="site.css?v=33">
</head><body>
<script src="data.js?v=33"></script><script src="site.js?v=33"></script>
<script>
// L’app Shortyear, proposée sous « Productivity » (demande de Sheyenne du 21/11/2026)
// Blueprints classés par besoin (validé par Sheyenne le 21/11/2026). Un blueprint peut être dans plusieurs besoins.
var NEEDS = [
  ["💰", "Improve my finances", ["money-mastery-system", "fix-your-money-mindset", "think-and-grow-rich"]],
  ["🌱", "Improve my self-esteem", ["stop-getting-in-your-own-way", "become-truly-effective", "rewire-your-habits"]],
  ["🎯", "Productivity", ["shortyear", "habits-dashboard", "focus-like-its-your-job", "become-truly-effective", "rewire-your-habits", "from-beginner-to-master"]],
  ["🤝", "Understand people", ["read-people-like-a-book", "master-the-art-of-human-behavior", "make-people-like-you", "become-irresistible"]],
  ["♟️", "Stop being underestimated", ["play-the-power-game", "the-prince", "negotiate-without-giving-in", "win-any-conflict", "the-art-of-war"]],
  ["🧠", "Stop fooling myself", ["outsmart-your-own-brain", "the-art-of-war", "the-prince"]]
].map(function (n) { return [n[0], n[1], n[2].filter(function (s) { return s === SY.s || bySlug(s); })]; });
// tout dans une seule liste : l’app, les blueprints, puis les Systems (plus de section Systems à part depuis le 21/11/2026)
var ALL = [SY].concat(P.filter(function (p) { return p.c !== 'systems'; }), P.filter(function (p) { return p.c === 'systems'; }));
mount('', '' +
  '<div class="wrap lib-page"><span id="systems"></span><section id="blueprints"><h2 class="lib-h">Blueprints / Systems</h2><div class="lib">' +
  '<nav class="lib-side" id="tabs" aria-label="What do you want to work on?"><div class="lib-q">I want to</div>' +
  '<button type="button" data-f="all" aria-pressed="true">📚 See everything<i>' + ALL.length + '</i></button>' +
  NEEDS.map(function (n, i) { return '<button type="button" data-f="' + i + '" aria-pressed="false">' + n[0] + ' ' + esc(n[1]) + '<i>' + n[2].length + '</i></button>'; }).join('') +
  '</nav><div class="lib-list" id="grid">' + ALL.map(function (p) { return fiche(p); }).join('') + '</div></div></section></div>');
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var f = b.getAttribute('data-f');
  [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  [].forEach.call(document.querySelectorAll('#grid .fc'), function (k) { k.hidden = f !== 'all' && NEEDS[f][2].indexOf(k.getAttribute('data-s')) < 0; });
});
</script></body></html>
