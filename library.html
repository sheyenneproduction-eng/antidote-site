<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · Antidote</title>
<link rel="stylesheet" href="site.css?v=20">
</head><body>
<script src="data.js?v=20"></script><script src="site.js?v=20"></script>
<script>
var rest = P.filter(function (p) { return p.c !== 'systems'; }), free = P.filter(function (p) { return !p.pr; }).length;
// L’app Shortyear, proposée sous « Productivity » (demande de Sheyenne du 21/11/2026)
var SY = { s: 'shortyear', c: 'app' };
function syCard() {
  var u = SHORTYEAR + '/?ref=antidote-library';
  return '<article class="k" data-c="app" data-s="shortyear"><a href="' + u + '"' + EXT + ' aria-label="Shortyear"><div class="th"><img src="assets/shortyear-card.png" alt="" loading="lazy"></div></a>' +
    '<a class="slip" href="' + u + '"' + EXT + '>Our app · Free trial →</a><h3><a href="' + u + '"' + EXT + '>Shortyear</a></h3><p>The goals planner app</p></article>';
}
// Blueprints classés par besoin (validé par Sheyenne le 21/11/2026). Un blueprint peut être dans plusieurs besoins.
var NEEDS = [
  ["💰", "Improve my finances", ["money-mastery-system", "fix-your-money-mindset", "think-and-grow-rich"]],
  ["🌱", "Improve my self-esteem", ["stop-getting-in-your-own-way", "become-truly-effective", "rewire-your-habits"]],
  ["⚡", "Get more done", ["focus-like-its-your-job", "become-truly-effective", "rewire-your-habits", "from-beginner-to-master"]],
  ["🎯", "Productivity", ["shortyear", "habits-dashboard", "become-truly-effective"]],
  ["🤝", "Understand people", ["read-people-like-a-book", "master-the-art-of-human-behavior", "make-people-like-you", "become-irresistible"]],
  ["♟️", "Stop being underestimated", ["play-the-power-game", "the-prince", "negotiate-without-giving-in", "win-any-conflict", "the-art-of-war"]],
  ["🧠", "Stop fooling myself", ["outsmart-your-own-brain", "the-art-of-war", "the-prince"]]
].map(function (n) { return [n[0], n[1], n[2].filter(function (s) { return s === SY.s || bySlug(s); })]; });
// les Systems rangés dans un besoin n’apparaissent dans la grille que sous ce besoin (ils ont leur propre section au-dessus)
var extra = [SY].concat(P).filter(function (p) { return p.c !== 'blueprints' && p.c !== 'challenges' && NEEDS.some(function (n) { return n[2].indexOf(p.s) >= 0; }); });
mount('', '<div class="top"><div class="wrap"><div class="eyebrow">The library</div><h1>The books you love, <em>ready to use.</em></h1>' +
  '<p class="sub">Blueprints turn one book into a plan. Systems run the parts of your life a single book can’t fix.</p></div></div>' +
  '<div class="wrap"><section id="systems"><div class="row-h"><h2>Systems</h2></div><div class="sys">' + systemCards() + '</div></section>' +
  '<section id="blueprints"><div class="row-h"><div><h2>Blueprints</h2><p class="need-q">What do you want to work on?</p><div class="tabs needs" id="tabs">' +
  '<button type="button" data-f="all" aria-pressed="true">All<i>' + rest.length + '</i></button>' +
  NEEDS.map(function (n, i) { return '<button type="button" data-f="' + i + '" aria-pressed="false"><b aria-hidden="true">' + n[0] + '</b>' + esc(n[1]) + '<i>' + n[2].length + '</i></button>'; }).join('') + '</div></div></div>' +
  '<div class="g1" id="grid">' + rest.concat(extra).map(function (p, i) { var c = p === SY ? syCard() : productCard(p, i); return p.c === 'systems' || p === SY ? c.replace('<article ', '<article hidden ') : c; }).join('') + '</div></section>' + newsletterBand() + '</div>');
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var f = b.getAttribute('data-f');
  [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  [].forEach.call(document.querySelectorAll('#grid .k'), function (k) { k.hidden = f === 'all' ? /systems|app/.test(k.getAttribute('data-c')) : NEEDS[f][2].indexOf(k.getAttribute('data-s')) < 0; });
});
</script></body></html>
